services:
  postgres-db:
    volumes: !override
      - pg-data:/var/lib/postgresql/data
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      # Seed.sql is large — give postgres enough time to finish loading before
      # declaring healthy and letting the API start.
      start_period: 120s

# in CI mode, override the external volume with a fresh local one.
# so server can start from scratch on postgresql db.
# Docker Compose merges volume configs, so we must explicitly clear external/name.
volumes:
  pg-data: !override
    driver: local